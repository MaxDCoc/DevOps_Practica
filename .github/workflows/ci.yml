name: CI

on:
  push:
    branches: [main, feature/integracion, fases6y7]
  pull_request:
    branches: [main, feature/integracion, fases6y7]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab1/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lab1/api/package-lock.json
      - run: npm ci
      - run: npm test

  build-and-push:
    name: Build and push Docker images
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: lab1/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/subastas-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/subastas-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: lab1/web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/subastas-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/subastas-web:${{ github.sha }}
