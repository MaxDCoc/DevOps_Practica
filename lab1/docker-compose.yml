x-api: &api
  build: ./api
  environment:
    - PORT=3000
    - REDIS_HOST=redis
    - REDIS_PORT=6379
  depends_on:
    redis:
      condition: service_healthy
  labels:
    - traefik.enable=true
    - traefik.http.routers.api.rule=PathPrefix(`/api`)
    - traefik.http.routers.api.priority=10
    - traefik.http.routers.api.service=api
    - traefik.http.services.api.loadbalancer.server.port=3000
    - traefik.http.services.api.loadbalancer.sticky.cookie=true
    - traefik.http.services.api.loadbalancer.sticky.cookie.name=api_sticky
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
    interval: 10s
    timeout: 3s
    retries: 3

services:
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    build: ./web
    environment:
      # Sin uso en local: Traefik intercepta /api antes de que llegue a
      # nginx. Solo hace falta un valor sintácticamente válido para que la
      # config de nginx no falle al arrancar. En la nube se sobreescribe
      # con la URL pública real de la API.
      - API_URL=http://api1:3000
      - NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=80

  api1:
    <<: *api

  api2:
    <<: *api

  api3:
    <<: *api

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
