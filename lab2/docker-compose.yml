# Plataforma completa salvo el dashboard (P4). P3 ya está en main: TELEMETRY=on
# exporta trazas a Jaeger y Prometheus scrapea api, validator, worker y rabbitmq.
# Funciona sin archivo .env: todos los valores tienen un default.
name: deployflow

x-app-healthcheck: &app-healthcheck
  # python:3.12-slim no trae wget ni curl. 127.0.0.1 y no localhost (lab1: IPv6 deja el contenedor unhealthy).
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  rabbitmq:
    image: rabbitmq:4.3.7-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-deployflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-deployflow}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # consola de administración
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # expuesto para redis-cli y para tests desde el host, como en lab1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC, para servicios que corren fuera de compose
      - "4318:4318"    # OTLP HTTP
    healthcheck:
      # La imagen no trae healthcheck propio. 13133 es la extensión de salud de Jaeger v2.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      # 127.0.0.1 y no localhost, como aprendimos en lab1 (ver AGENTS.md)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  validator:
    build:
      context: .
      dockerfile: services/validator/Dockerfile
    environment:
      TELEMETRY: "on"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LOG_LEVEL: INFO
      VALIDATOR_LATENCY_MS: "150"
    ports:
      - "8001:8000"  # Swagger del validador
    restart: unless-stopped
    healthcheck: *app-healthcheck

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      STATE_BACKEND: redis
      PUBLISHER: rabbit
      TELEMETRY: "on"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-deployflow}:${RABBITMQ_PASS:-deployflow}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      VALIDATOR_URL: http://validator:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      validator:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *app-healthcheck

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      STATE_BACKEND: redis
      TELEMETRY: "on"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-deployflow}:${RABBITMQ_PASS:-deployflow}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LOG_LEVEL: INFO
      MAX_ATTEMPTS: "3"
      WORKER_METRICS_PORT: "8000"
    # Sin ports: si se publicara el 8000, --scale worker=3 chocaría en el host.
    # SIGTERM deja terminar el job en curso, y connection.sleep() no se corta a mitad
    # de una etapa. 3 etapas de 30 s (máximo del contrato) caben en 120 s.
    stop_grace_period: 120s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *app-healthcheck
