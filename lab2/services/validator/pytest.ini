[pytest]
testpaths = tests
pythonpath = .
# Starlette 1.9 avisa que TestClient con httpx está en desuso (propone httpx2). Es de la librería, no
# de nuestro código: se silencia solo ese mensaje. Revisar al actualizar FastAPI/Starlette.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
