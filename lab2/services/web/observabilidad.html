<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Observabilidad</title>
<style>
  :root { color-scheme:dark; --bg:#0c111a; --ink:#b8c8db; --cyan:#6edcf4; --violet:#baa5ff; --green:#7ce4b3; --red:#ff7c83; --amber:#efbc72; }
  * { box-sizing:border-box; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); }
  body { background:radial-gradient(ellipse at 50% 25%,#162131 0%,#0c111a 72%); }
  main { width:100%; height:100%; display:grid; place-items:center; }
  #scene { display:block; width:100%; height:100%; max-width:1800px; }
  .wire { fill:none; stroke:#40516a; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .wire.secondary { stroke:#34445b; stroke-dasharray:4 7; stroke-width:1.1; }
  .wire.telemetry { stroke:var(--wire-color); stroke-width:1.9; opacity:.42; }
  .wire.telemetry-trace { stroke-dasharray:7 5; }
  .wire.telemetry-log { stroke-dasharray:1 6; }
  .wire.telemetry-metric { stroke-dasharray:12 4 2 4; }
  .node .shell { fill:#131e2c; stroke:#42536b; stroke-width:1.4; }
  .node .icon { color:#b8c8db; }
  .node .halo { opacity:0; fill:none; stroke:var(--node-color,var(--cyan)); stroke-width:7; }
  .node.is-active .shell { stroke:var(--node-color,var(--cyan)); fill:#192b3b; }
  .node.is-active .icon { color:var(--node-color,var(--cyan)); }
  .node.is-active .halo { opacity:.08; }
  .node.is-done .shell { stroke:var(--green); }
  .node.is-done .icon { color:var(--green); }
  .node.is-error .shell { stroke:var(--red); fill:#30202d; }
  .node.is-error .icon { color:var(--red); }
  .node.is-blocked .shell { stroke:#344054; stroke-dasharray:4 5; fill:#111925; }
  .node.is-blocked .icon { opacity:.24; }
  .otel { color:var(--amber); opacity:.45; }
  .node.is-active .otel { opacity:1; }
  .status { opacity:0; }
  .is-done .done-status,.is-error .error-status,.is-blocked .blocked-status { opacity:1; }
  .panel { fill:#101925; stroke:#314159; stroke-width:1; }
  .panel-rule { stroke:#28374b; stroke-width:1; }
  .trace-bar { fill:var(--trace-color); rx:2; }
  .trace-bar.is-error { fill:var(--red); }
  .trace-stem { fill:none; stroke:#3d526b; stroke-width:1; }
  .panel-rule,#trace-view > path,#trace-view > circle,#metric-view > g[fill="none"] { pointer-events:none; }
  .packet { pointer-events:none; }
  .packet-trail { opacity:.18; }
  .log-row .log-line { stroke:#53647b; stroke-width:3; stroke-linecap:round; }
  .log-row.is-error .log-line { stroke:#c26d7e; }
  .log-row.is-error .log-bg { fill:#ff7c8310; }
  .queue-slot { fill:#1c293a; stroke:#3a4b61; }
  .queue-slot.occupied { stroke:var(--violet); fill:#baa5ff28; }
  .metric-pip { fill:#25354a; }
  #metric-success .filled { fill:var(--green); }
  #metric-failures .filled { fill:var(--red); }
  .controls { position:fixed; bottom:20px; right:24px; display:flex; gap:6px; align-items:center; }
  button { border:1px solid #34445a; border-radius:50%; width:42px; height:42px; padding:11px; color:#b8c8db; background:#111c2b; cursor:pointer; display:grid; place-items:center; }
  button:hover { background:#1e3045; color:#fff; }
  button:focus-visible,input:focus-visible { outline:2px solid var(--cyan); outline-offset:5px; }
  button svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  input[type=range] { position:fixed; left:32px; bottom:38px; width:calc(100% - 228px); height:4px; margin:0; appearance:none; border:0; border-radius:4px; cursor:pointer; background:#29384c; accent-color:var(--cyan); }
  input[type=range]::-webkit-slider-thumb { appearance:none; width:10px; height:10px; border-radius:50%; background:#a9cbdc; }
  input[type=range]::-moz-range-thumb { width:10px; height:10px; border:0; border-radius:50%; background:#a9cbdc; }
  @media(max-width:600px) { .controls { bottom:18px; right:14px; } input[type=range] { left:18px; width:calc(100% - 188px); bottom:38px; } button { width:38px; height:38px; padding:10px; } }
  .inspectable { cursor:help; }
  .inspectable:focus-visible { outline:2px solid var(--cyan); outline-offset:5px; }
  .node.is-selected .shell { stroke:#e4f4ff; stroke-width:2; }
  .wire { pointer-events:none; }
  .wire-hit { fill:none; stroke:transparent; stroke-width:18; pointer-events:stroke; cursor:help; }
  .wire-hit:hover,.wire-hit.is-selected { stroke:#b8dbff35; stroke-width:10; }
  .packet { pointer-events:all; }
  .packet-hit { fill:transparent; pointer-events:all; }
  .packet .packet-trail,.packet rect { pointer-events:none; }
  .packet.is-selected .packet-trail { opacity:.65; }
  .trace-bar { stroke:transparent; stroke-width:4; pointer-events:all; }
  .trace-bar:hover,.trace-bar.is-selected { stroke:#e9f6ff; stroke-width:1.5; }
  .log-row:hover .log-bg,.log-row.is-selected .log-bg { fill:#b8dfff15; }
  .metric-hit { fill:transparent; pointer-events:all; }
  .metric-hit:hover,.metric-hit.is-selected { fill:#9bbedf0a; stroke:#748da540; }
  #metric-success.is-selected,#metric-failures.is-selected { filter:drop-shadow(0 0 5px #b9d9ff66); }
  .controls { z-index:20; }
  #speed { height:42px; border:1px solid #34445a; border-radius:20px; padding:0 10px; background:#111c2b; color:#d5e5f5; font:13px ui-monospace,monospace; cursor:pointer; }
  #speed:focus-visible { outline:2px solid var(--cyan); outline-offset:4px; }
  input[type=range] { width:calc(100% - 320px); }
  #inspector { --detail-color:var(--cyan); position:fixed; z-index:30; top:18px; right:18px; width:360px; max-height:calc(100dvh - 106px); overflow:auto; border:1px solid #536783; border-top:2px solid var(--detail-color); border-radius:14px; background:#111c2bf5; box-shadow:0 20px 80px #0008; padding:20px; color:#cedbea; font:13px/1.55 system-ui,sans-serif; scrollbar-width:thin; scrollbar-color:#4b607b #152235; }
  #inspector.at-left { right:auto; left:18px; }
  #inspector[hidden] { display:none; }
  #inspector.is-preview { padding:12px 14px; max-height:150px; }
  #inspector.is-preview #inspect-title { font-size:14px; }
  #inspector.is-preview #inspect-summary,
  #inspector.is-preview #inspect-fields,
  #inspector.is-preview #inspect-payload,
  #inspector.is-preview #inspect-mode,
  #inspector.is-preview .simulation-note { display:none; }
  .inspector-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  #inspect-category { display:block; margin-bottom:5px; color:var(--detail-color); font:10px/1.4 ui-monospace,monospace; letter-spacing:.1em; }
  #inspect-title { margin:0; color:#f1f6fc; font-size:18px; line-height:1.3; }
  #inspect-close { flex-shrink:0; width:32px; height:32px; padding:7px; }
  #inspect-summary { margin:15px 0; }
  #inspect-fields { margin:0; display:grid; grid-template-columns:1fr; gap:3px; }
  #inspect-fields dt { color:#8cabc8; font-size:11px; margin-top:8px; }
  #inspect-fields dd { margin:0; color:#e4edf8; overflow-wrap:anywhere; }
  #inspect-payload { padding:12px; margin:16px 0 0; max-height:235px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; border:1px solid #304259; border-radius:9px; background:#0b1420; color:#b8dbed; font:11px/1.65 ui-monospace,monospace; }
  #inspect-mode { margin:16px 0 4px; color:var(--detail-color); font-size:11px; }
  .simulation-note { display:block; color:#9badc1; font-size:10px; }
  .is-paused .node * { transition:none; }
  @media(max-width:600px) {
    input[type=range] { width:calc(100% - 260px); }
    #speed { height:38px; padding:0 7px; font-size:12px; }
    #inspector,#inspector.at-left { top:auto; left:12px; right:12px; bottom:82px; width:auto; max-height:48dvh; padding:16px; }
    #inspect-close { width:38px; height:38px; }
  }

  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
</style>
</head>
<body>
<main>
<svg id="scene" viewBox="0 0 1440 900" role="group" aria-label="Simulación interactiva de un pedido exitoso y otro fallido: API, validador, cola y worker; trazas, métricas y logs correlacionados. Los colores identifican cada recorrido.">
<defs>

  <marker id="arrow-trace" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 5 3-5 3" fill="none" stroke="#6edcf4" stroke-width="1.3"/></marker>
  <marker id="arrow-log" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 5 3-5 3" fill="none" stroke="#efbc72" stroke-width="1.3"/></marker>
  <marker id="arrow-metric" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 5 3-5 3" fill="none" stroke="#b9a3ff" stroke-width="1.3"/></marker>

  <symbol id="i-api" viewBox="-24 -24 48 48"><rect x="-21" y="-21" width="42" height="42" rx="8"/><path d="M-10-10c-5 0-3 9-7 10 4 1 2 10 7 10m20-20c5 0 3 9 7 10-4 1-2 10-7 10"/><circle cx="0" cy="-7" r="1"/><circle cx="0" cy="0" r="1"/><circle cx="0" cy="7" r="1"/></symbol>

  <symbol id="i-db" viewBox="-24 -24 48 48"><ellipse cx="0" cy="-14" rx="20" ry="7"/><path d="M-20-14v28c0 9 40 9 40 0v-28M-20 0c0 9 40 9 40 0"/></symbol>
  <symbol id="i-trace" viewBox="-24 -24 48 48"><path d="M-18-17h26m-26 0v34m0-23h16m-16 11h29m-29 12h20"/><circle cx="12" cy="-17" r="4"/><circle cx="3" cy="-6" r="4"/><circle cx="16" cy="5" r="4"/><circle cx="6" cy="17" r="4"/></symbol>

</defs>
<rect x="40" y="48" width="1360" height="500" fill="url(#grid)" opacity=".65"/>
<path d="M64 566h1312" stroke="#34445b" opacity=".45"/>
<g id="wires"></g>
<g id="nodes"></g>
<g id="queue-slots"></g>
<g id="panels">
  <rect id="panel-traces" class="panel" x="64" y="600" width="400" height="245" rx="18"/>

  <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <use href="#i-trace" x="86" y="616" width="29" height="29" color="#6edcf4"/>

    <path d="M548 675v78h344M548 714h344M634 675v78M720 675v78M806 675v78" fill="none" stroke="#29384b" stroke-width="1"/>
    <path id="requests-area" fill="#6edcf40c"/>
    <path id="requests-line" fill="none" stroke="#6edcf4" stroke-width="2" stroke-linejoin="round"/>
    <path id="failures-line" fill="none" stroke="#ff7c83" stroke-width="2" stroke-linejoin="round"/>

</main>
<input id="timeline" type="range" min="0" max="26" step="0.01" value="0" aria-label="Recorrido de la simulación">
<div class="controls" role="group" aria-label="Controles de la simulación">
  <select id="speed" aria-label="Velocidad de reproducción"><option value="0.1">0,1×</option><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1" selected>1×</option></select>

  <button id="fullscreen" aria-label="Pantalla completa"><svg viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button>
</div>
<aside id="inspector" role="region" aria-labelledby="inspect-title" hidden>
  <div class="inspector-heading">
    <div><span id="inspect-category"></span><h2 id="inspect-title"></h2></div>
    <button id="inspect-close" aria-label="Cerrar inspector"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
  </div>

  <dl id="inspect-fields"></dl>
  <pre id="inspect-payload" aria-label="Datos de ejemplo"></pre>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const C = { a:'#6edcf4', b:'#baa5ff', ok:'#7ce4b3', error:'#ff7c83', amber:'#efbc72', scrape:'#b9a3ff' };
  const DURATION = 26;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reducedMotion.matches;
  let time = paused ? 9 : 0;
  let previousFrame = null;
  let speed = 1;
  let inspection = null;
  let pinned = false;
  let hideTimer = null;
  let restoringFocus = false;
  const SCRAPES = [4,9,14,19];
  const DURATION_BUCKETS = [1,2,5,10,20,30,60,120,300,Infinity];
  const JOBS = {
    a:{id:'job-demo-a',trace:'4bf92f3577b34da6a3ce929d0e0e4736',created:3.1,start:5.3,end:12.8,result:'succeeded',color:C.a},
    b:{id:'job-demo-b',trace:'7d7b93e091bf0d02382eaaa18f4af000',created:8.5,start:13.8,end:18.8,result:'failed',color:C.b}
  };
  const SERVICE_NAMES = {api:'API principal',validator:'Validador',rabbit:'RabbitMQ',worker:'Worker'};
  const SPAN_NAMES = ['POST /pipelines','POST /validate (cliente HTTP)','POST /validate','publish pipeline.jobs','process pipeline.jobs','stage build','stage test','stage deploy'];
  const SPAN_KINDS = ['SERVER','CLIENT','SERVER','PRODUCER','CONSUMER','INTERNAL','INTERNAL','INTERNAL'];
  const SPAN_PARENTS = [null,0,1,0,3,4,4,4];
  const stamp = value => value.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})+' s';
  const spanId = (job,row) => (job==='a'?'a':'b')+(row+1).toString(16).padStart(15,'0');
  function pipeline(job) {
    return {project:'demo-observabilidad',branch:'main',config:{stages:['build','test','deploy'],stage_seconds:3,fail_at:job==='b'?'test':null}};
  }
  function statusAt(job,t=time) {
    const item=JOBS[job];
    return t<item.created?'sin crear':t<item.start?'queued':t<item.end?'running':item.result;
  }
  function jobAt(t=time) { return t>=6?'b':'a'; }
  function samplesAt(t=time) {
    const received=SCRAPES.filter(start=>t>=start+1.3);
    const sample=received.length?received.at(-1)+.6:null;
    const completed=sample===null?[]:Object.values(JOBS).filter(job=>job.end<=sample);
    const accepted=sample===null?0:Number(sample>=4.1)+Number(sample>=9.5);
    const succeeded=completed.filter(job=>job.result==='succeeded').length;
    const failed=completed.filter(job=>job.result==='failed').length;
    const durations=completed.map(job=>Number((job.end-job.created).toFixed(2)));
    return {received,sample,accepted,succeeded,failed,durations};
  }
  function fieldsForJob(job) {
    return [['Trabajo',JOBS[job].id],['trace_id',JOBS[job].trace],['Estado del trabajo',statusAt(job)]];
  }
  function nodeInfo(id) {
    const job=id==='redis'?(time>=JOBS.b.created?'b':'a'):id==='rabbit'?(time>=8.8?'b':'a'):jobAt();
    const common=fieldsForJob(job);
    const definitions={
      source:{title:'Swagger · cliente',description:'Desde esta pantalla se pide ejecutar un pipeline. Swagger sirve para probar la API: no recoge métricas ni trazas.',fields:[['Envía','POST /pipelines → API principal'],['Recibe','202 Accepted + job_id + trace_id'],['Importante','202 significa aceptado; no significa terminado.']],payload:pipeline(job)},
      api:{title:'API principal · FastAPI',description:'Valida el pedido por HTTP, crea el estado en Redis y publica el trabajo en RabbitMQ. Responde sin esperar al worker.',fields:[['Entrada','POST /pipelines'],['Salidas','Validador → Redis → RabbitMQ → respuesta 202'],['Observabilidad','Span SERVER, llamada CLIENT, publicación PRODUCER y métricas HTTP'],...common],payload:{...pipeline(job),response:{job_id:JOBS[job].id,status:'queued',trace_id:JOBS[job].trace}}},
      validator:{title:'Validador · FastAPI',description:'Comprueba proyecto, orden de etapas, duración y fallo solicitado. Su respuesta vuelve a la API; no ejecuta el pipeline.',fields:[['Entrada','POST /validate desde la API'],['Respuesta','200 + resultado de negocio'],['Captura','OpenTelemetry: span SERVER e identificación de la misma traza']],payload:{valid:true,errors:[]}},

  node('stage-deploy','deploy',1185,405,104,80,C.a);
  node('redis','db',665,470,104,80,'#d69aa9');
  const workerRing = el('circle',{cx:935,cy:297,r:35,fill:'none',stroke:C.a,'stroke-width':2,
    'stroke-dasharray':'220', 'stroke-dashoffset':'220', 'pointer-events':'none', transform:'rotate(-90 935 297)'},$('nodes'));
  const queueSlots = Array.from({length:3},(_,i)=>el('rect',{x:636+i*21,y:371,width:15,height:8,rx:3,class:'queue-slot'},$('queue-slots')));

  const packetPool = [];
  function packet(index, routeName, fraction, color, shape='dot', details={}) {
    if (fraction<0 || fraction>1) return;
    let item = packetPool[index];
    if (!item) {
      const group=el('g',{class:'packet'},$('packets'));
      const trail=el('circle',{r:10,class:'packet-trail'},group);
      const body=el('rect',{x:-5,y:-5,width:10,height:10,rx:3,stroke:'#edfaff','stroke-width':.7},group);
      el('circle',{r:15,class:'packet-hit'},group);
      item={group,trail,body,snapshot:null}; packetPool[index]=item;
      inspectable(group,'Paquete en tránsito',()=>packetInfo(item.snapshot));
    }
    item.snapshot={...details,route:routeName,fraction};
    item.group.setAttribute('data-route',routeName);
    item.group.setAttribute('tabindex',paused?'0':'-1');
    const data=routes[routeName];
    const point=data.path.getPointAtLength(data.length*fraction);
    item.group.style.display='';
    item.group.setAttribute('transform',`translate(${point.x} ${point.y})`);
    item.trail.setAttribute('fill',color); item.body.setAttribute('fill',color);
    item.body.setAttribute('transform',shape==='sample'?'rotate(45)':'rotate(0)');
    item.body.setAttribute('rx',shape==='sample'?1:3);
  }

  const traceEvents = [];
  const spans = [
    {job:'a',row:0,service:'api',start:1.5,end:4.1},
    {job:'a',row:1,service:'api',start:1.8,end:3.0},
    {job:'a',row:2,service:'validator',start:2.1,end:2.7},
    {job:'a',row:3,service:'api',start:3.4,end:4.0},
    {job:'a',row:4,service:'worker',start:5.3,end:12.8},
    {job:'a',row:5,service:'worker',start:5.6,end:7.8},
    {job:'a',row:6,service:'worker',start:8.0,end:10.2},
    {job:'a',row:7,service:'worker',start:10.4,end:12.6},
    {job:'b',row:0,service:'api',start:6.9,end:9.5},
    {job:'b',row:1,service:'api',start:7.2,end:8.4},
    {job:'b',row:2,service:'validator',start:7.5,end:8.1},
    {job:'b',row:3,service:'api',start:8.8,end:9.4},
    {job:'b',row:4,service:'worker',start:13.8,end:18.8},
    {job:'b',row:5,service:'worker',start:14.0,end:16.2},
    {job:'b',row:6,service:'worker',start:16.4,end:18.6,error:true}
  ];
  for (const job of ['a','b']) {
    const top=job==='a'?668:758;
    el('path',{d:`M101 ${top+3}v63m0-63h13m-13 9h13m-13 9h13m-13 9h13m-13 9h13m-13 9h13m-13 9h13`,class:'trace-stem'},$('trace-view'));
    el('circle',{cx:101,cy:top-5,r:3,fill:C[job]},$('trace-view'));
    for (const x of [156,226,296,366,436]) el('path',{d:`M${x} ${top-3}v70`,stroke:'#243247','stroke-dasharray':'1 5'},$('trace-view'));
  }
  for (const event of spans) {
    const top=event.job==='a'?668:758;
    event.exported=event.end+.85;
    event.bar=el('rect',{x:128+event.start*14,y:top+event.row*9,width:Math.max(5,(event.end-event.start)*14),height:5,
      class:'trace-bar'+(event.error?' is-error':''),style:`--trace-color:${C[event.job]}`,opacity:0},$('trace-view'));
    if (event.error) event.mark=el('circle',{cx:132+event.end*14,cy:top+event.row*9+2.5,r:2,fill:C.b,opacity:0},$('trace-view'));
    inspectable(event.bar,SPAN_NAMES[event.row]+' · pedido '+event.job.toUpperCase(),()=>spanInfo(event));
    traceEvents.push({route:'trace-'+event.service,start:event.end+.05,duration:.8,color:C[event.job],shape:'sample',span:event});
  }

  const histogram = DURATION_BUCKETS.map((_,i)=>el('rect',{x:548+i*14,y:815,width:9,height:1,rx:2,fill:i>6?'#baa5ff':'#6edcf4',opacity:.65},$('histogram')));
  const pips={};
  for (const [name,x] of [['success',766],['failures',848]]) {
    pips[name]=Array.from({length:6},(_,i)=>el('rect',{x:x+(i%3)*12,y:780+Math.floor(i/3)*14,width:8,height:8,rx:2,class:'metric-pip'},$('metric-'+name)));
  }
  const logEvents = [
    {at:0,color:'#65758c',row:0,service:null},
    {at:0,color:'#65758c',row:1,service:null},
    {at:4.95,color:C.a,row:2,service:'api'},
    {at:10.35,color:C.b,row:3,service:'api'},
    {at:19.45,color:C.b,row:4,service:'worker',error:true}
  ];
  for (const item of logEvents) {
    const y=677+item.row*29;
    item.group=el('g',{class:'log-row'+(item.error?' is-error':''),opacity:0},$('log-view'));
    el('rect',{x:994,y:y-9,width:364,height:23,rx:5,class:'log-bg',fill:'transparent'},item.group);
    el('circle',{cx:1007,cy:y+2,r:3.5,fill:item.color},item.group);
    if(item.error)el('circle',{cx:1007,cy:y+2,r:7,fill:'none',stroke:C.error,'stroke-width':1.2},item.group);
    const segments=[[1024,1053],[1063,1080],[1090,1138],[1148,1172],[1182,1221],[1231,1251],[1261,1327]];
    for(const [x1,x2] of segments)el('path',{d:`M${x1} ${y+2}H${x2}`,class:'log-line',opacity:item.row===0?.5:.85},item.group);
    inspectable(item.group,item.error?'Log de error en test':'Evento de log',()=>logInfo(item));
  }
  const inRange=(t,start,end)=>t>=start&&t<end;
  function state(id, active=false, done=false, error=false, blocked=false) {
    const group=$(id);
    group.classList.toggle('is-active',active);
    group.classList.toggle('is-done',done);
    group.classList.toggle('is-error',error);
    group.classList.toggle('is-blocked',blocked);
  }
  function chartPath(points) { return points.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '); }
  function metrics(t) {
    const s=samplesAt(t);
    const requests=[[548,747]],failures=[[548,747]];
    for(const start of s.received) {
      const x=548+(start+1.3)/24*344;
      requests.push([x,747-(start+.6>=9.5?2:start+.6>=4.1?1:0)*28]);
      failures.push([x,747-(start+.6>=18.8?1:0)*28]);
    }
    const x=548+Math.min(t,24)/24*344;
    requests.push([x,requests.at(-1)[1]]);failures.push([x,failures.at(-1)[1]]);
    $('requests-line').setAttribute('d',chartPath(requests));
    $('failures-line').setAttribute('d',chartPath(failures));
    $('requests-area').setAttribute('d',chartPath(requests)+` L${x} 753 L548 753Z`);
    histogram.forEach((bar,i)=>{
      const count=s.durations.filter(duration=>duration<=DURATION_BUCKETS[i]).length;
      const height=2+count*16;
      bar.setAttribute('height',height);bar.setAttribute('y',815-height);
    });
    pips.success.forEach((pip,i)=>pip.classList.toggle('filled',i<s.succeeded));
    pips.failures.forEach((pip,i)=>pip.classList.toggle('filled',i<s.failed));
    $('scrape-light').setAttribute('fill',SCRAPES.some(start=>inRange(t,start,start+1.3))?C.scrape:'#535e77');
  }
  const journeys=[
    {route:'request',start:.6,duration:.9,color:C.a},
    {route:'validate',start:1.8,duration:.3,color:C.a},
    {route:'validated',start:2.7,duration:.3,color:C.a},
    {route:'publish',start:3.4,duration:.6,color:C.a},
    {route:'accepted',start:4.1,duration:1,color:C.ok,job:'a'},
    {route:'consume',start:4.5,duration:.8,color:C.a},
    {route:'build',start:5.3,duration:.3,color:C.a},
    {route:'test',start:7.8,duration:.2,color:C.a},
    {route:'deploy',start:10.2,duration:.2,color:C.a},
    {route:'ack',start:12.8,duration:.7,color:C.ok,job:'a'},
    {route:'request',start:6,duration:.9,color:C.b},
    {route:'validate',start:7.2,duration:.3,color:C.b},
    {route:'validated',start:8.1,duration:.3,color:C.b},
    {route:'publish',start:8.8,duration:.6,color:C.b},
    {route:'accepted',start:9.5,duration:1,color:C.ok,job:'b'},
    {route:'consume',start:13,duration:.8,color:C.b},
    {route:'build',start:13.8,duration:.2,color:C.b},
    {route:'test',start:16.2,duration:.2,color:C.b},
    {route:'ack',start:18.8,duration:.7,color:C.ok,job:'b'},
    {route:'state-api',start:3.1,duration:.65,color:C.a,shape:'sample'},
    {route:'state-api',start:8.5,duration:.65,color:C.b,shape:'sample'},
    ...[5.6,7.8,8,10.2,10.4,12.8].map(start=>({route:'state-worker',start,duration:.65,color:C.a,shape:'sample'})),
    ...[14,16.2,16.4].map(start=>({route:'state-worker',start,duration:.65,color:C.b,shape:'sample'})),
    {route:'state-worker',start:18.8,duration:.65,color:C.error,shape:'sample'},
    ...traceEvents,
    ...logEvents.filter(event=>event.service).map(event=>({route:'log-'+event.service,start:event.at-.8,duration:.8,color:event.color,shape:'sample',log:event}))
  ];
  for(const journey of journeys) {
    journey.job=journey.job||(journey.color===C.a?'a':'b');
  }
  for(const [index,kind] of ['traces','metrics','logs'].entries()) {
    const label=kind==='traces'?'Jaeger · trazas':kind==='metrics'?'Prometheus · métricas':'Logs JSON';
    inspectable($('panel-'+kind),label,()=>panelInfo(kind));
    const header=el('rect',{x:80+index*456,y:610,width:44,height:44,rx:7,class:'metric-hit'},$('panels'));
    inspectable(header,label,()=>panelInfo(kind));
  }
  el('rect',{x:630,y:363,width:74,height:25,rx:5,class:'metric-hit'},$('queue-slots'));
  inspectable($('queue-slots'),'Mensajes esperando en RabbitMQ',()=>nodeInfo('rabbit'));
  inspectable($('scrape-status'),'Prometheus · estado del scrape',()=>({...metricInfo('panel'),fields:[['Indicador',SCRAPES.some(start=>inRange(time,start,start+1.3))?'Scrape en curso: consulta y respuesta':'Esperando el siguiente scrape'],...metricInfo('panel').fields]}));
  const plotHit=el('rect',{id:'metric-plot-hit',x:544,y:671,width:352,height:86,rx:5,class:'metric-hit'},$('metric-view'));
  inspectable(plotHit,'Gráfica de pedidos y fallos',()=>metricInfo('plot'));
  el('rect',{x:544,y:766,width:146,height:59,rx:5,class:'metric-hit'},$('histogram'));
  inspectable($('histogram'),'Histograma de duraciones',()=>metricInfo('histogram'));
  for(const kind of ['success','failures']) {
    el('rect',{x:kind==='success'?738:820,y:765,width:69,height:58,rx:5,class:'metric-hit'},$('metric-'+kind));
    inspectable($('metric-'+kind),kind==='success'?'Contador de éxitos':'Contador de fallos',()=>metricInfo(kind));
  }
  for(const [x,y,service] of [[419,342,'api'],[419,172,'validator'],[984,342,'worker']]) {
    const badge=el('circle',{cx:x,cy:y,r:14,fill:'transparent'},$('nodes'));
    inspectable(badge,'Instrumentación OpenTelemetry · '+service,()=>({category:'INSTRUMENTACIÓN',title:'OpenTelemetry · '+service,color:C.amber,description:'La marca dorada representa la instrumentación dentro del servicio. Crea spans con un Resource service.name, conserva el contexto y exporta a Jaeger. No es un servicio intermedio por el que pase el trabajo.',fields:[['Servicio',service],['Configuración','TracerProvider → BatchSpanProcessor → exportador OTLP gRPC'],['Al salir','Flush de spans pendientes para no perder la última ejecución.']],payload:{'service.name':service,endpoint:'http://jaeger:4317'}}));
  }
  function render(t) {
    const second=t>=13.8;
    state('source',inRange(t,.6,1.5)||inRange(t,6,6.9),inRange(t,5.1,6)||t>=10.5);
    state('api',inRange(t,1.5,4.1)||inRange(t,6.9,9.5));
    state('validator',inRange(t,2.1,2.7)||inRange(t,7.5,8.1),inRange(t,2.7,7.5)||t>=8.1);
    state('rabbit',inRange(t,3.4,5.3)||inRange(t,8.8,13.8));
    state('worker',inRange(t,5.3,12.8)||inRange(t,13.8,18.8),inRange(t,12.8,13.8),t>=18.8);
    const start=second?14:5.6, buildEnd=second?16.2:7.8, testStart=second?16.4:8, testEnd=second?18.6:10.2;
    state('stage-build',inRange(t,start,buildEnd),t>=buildEnd);
    state('stage-test',inRange(t,testStart,testEnd),!second&&t>=10.2,second&&t>=18.6);
    state('stage-deploy',!second&&inRange(t,10.4,12.6),!second&&t>=12.6,false,second&&t>=18.6);
    state('redis',journeys.some(j=>j.route.startsWith('state-')&&inRange(t,j.start,j.start+j.duration)));
    const color=second?C.b:C.a;
    for(const id of ['worker','stage-build','stage-test','stage-deploy'])$(id).style.setProperty('--node-color',color);
    const progress=second?Math.max(0,Math.min(1,(t-13.8)/5)):Math.max(0,Math.min(1,(t-5.3)/7.5));
    workerRing.setAttribute('stroke-dashoffset',220*(1-progress));
    workerRing.setAttribute('opacity',inRange(t,5.3,12.8)||inRange(t,13.8,18.8)?1:0);
    workerRing.setAttribute('stroke',color);
    queueSlots.forEach((slot,i)=>slot.classList.toggle('occupied',i===0&&inRange(t,9.4,13)));
    for(const event of spans) {
      const visible=t>=event.exported;
      event.bar.setAttribute('opacity',visible?1:0);event.bar.style.visibility=visible?'visible':'hidden';
      if(event.mark)event.mark.setAttribute('opacity',visible?1:0);
    }
    logEvents.forEach(event=>{const visible=t>=event.at;event.group.setAttribute('opacity',visible?1:0);event.group.style.visibility=visible?'visible':'hidden';});
    packetPool.forEach(item=>item.group.style.display='none');
    let count=0;
    for(const j of journeys)if(inRange(t,j.start,j.start+j.duration))packet(count++,j.route,(t-j.start)/j.duration,j.color,j.shape,j);
    // Prometheus inicia la consulta; la muestra vuelve por el mismo camino.
    for(const start of SCRAPES)for(const service of ['api','validator','rabbit','worker']) {
      if(inRange(t,start,start+.6))packet(count++,'scrape-'+service,(t-start)/.6,C.scrape,'sample',{direction:'outbound',sampleAt:start+.6});
      else if(inRange(t,start+.6,start+1.3))packet(count++,'scrape-'+service,1-(t-start-.6)/.7,C.scrape,'sample',{direction:'return',sampleAt:start+.6});
    }
    // El mensaje conserva su color mientras espera dentro de la cola.
    if(inRange(t,4,4.5))packet(count++,'publish',1,C.a,'dot',{job:'a',waiting:true});
    if(inRange(t,9.4,13))packet(count++,'publish',1,C.b,'dot',{job:'b',waiting:true});
    metrics(t);
    if(inspection&&!pinned) {
      if(inspection.element.style.display==='none'||inspection.element.style.visibility==='hidden')closeInspector();
      else drawInspection(inspection.reader());
    }
    $('timeline').value=t;
    $('timeline').setAttribute('aria-valuetext',Math.round(t)+' segundos');
    $('timeline').style.background=`linear-gradient(to right,#6c9aac ${t/DURATION*100}%,#29384c ${t/DURATION*100}%)`;
  }
  function syncPause() {
    $('pause').setAttribute('aria-pressed',String(paused));
    $('pause').setAttribute('aria-label',paused?'Reanudar':'Pausar');
    $('pause-icon').setAttribute('href',paused?'#i-play':'#i-pause');
    document.body.classList.toggle('is-paused',paused);
    packetPool.forEach(item=>item.group.setAttribute('tabindex',paused?'0':'-1'));
  }
  $('pause').addEventListener('click',()=>{paused=!paused;previousFrame=null;if(!paused)closeInspector();syncPause();});
  $('restart').addEventListener('click',()=>{closeInspector();time=0;previousFrame=null;render(time);});
  $('timeline').addEventListener('input',event=>{closeInspector();time=Number(event.target.value);previousFrame=null;render(time);});
  $('speed').addEventListener('change',event=>{speed=Number(event.target.value)||1;previousFrame=null;});
  $('inspect-close').addEventListener('click',()=>closeInspector(true));
  $('inspector').addEventListener('pointerenter',()=>clearTimeout(hideTimer));
  $('inspector').addEventListener('pointerleave',scheduleClose);
  document.addEventListener('click',event=>{
    if(!event.target.closest('.inspectable,#inspector,.controls,input'))closeInspector();
  });
  $('fullscreen').addEventListener('click',async()=>{
    try {if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.preventDefault();closeInspector(true);return;}
    if(event.code==='Space'&&!['BUTTON','INPUT','SELECT'].includes(document.activeElement.tagName)&&!document.activeElement.closest('.inspectable')) {event.preventDefault();paused=!paused;previousFrame=null;if(!paused)closeInspector();syncPause();}
  });
  document.addEventListener('visibilitychange',()=>{previousFrame=null;});
  reducedMotion.addEventListener('change',event=>{if(event.matches){paused=true;syncPause();}});
  function frame(now) {
    if(previousFrame!==null&&!paused&&!document.hidden) {
      const next=time+Math.min(Math.max((now-previousFrame)/1000,0),.2)*speed;
      if(next>=DURATION)closeInspector();
      time=next%DURATION;render(time);
    }
    previousFrame=now;
    requestAnimationFrame(frame);
  }
  syncPause();render(time);requestAnimationFrame(frame);
})();
</script>
